packages:
  - desktop

# Match the runtime package: optional provider peers are not installed implicitly.
autoInstallPeers: false
linkWorkspacePackages: false
excludeLinksFromLockfile: false
allowBuilds:
  tesseract.js: false

# Runtime packages are consumed by exact npm versions; no source checkout or
# local link is recorded in the lockfile.
# Preserve the existing compatible transitive version in the pinned runtime graph.
overrides:
  object-inspect: 1.13.4
minimumReleaseAgeExclude:
  - 'craft-common-store-local@0.21.0'
  - 'craft-common-base@0.20.5'
  - 'craft-common-log@0.20.13'
  - '@craft/capability-memory@0.20.9'
  - '@craft/capability-knowledge@0.20.9'
  - '@craft/capability-experience@0.21.0'
  - '@craft/capability-context@0.21.0'
  - '@craft/capability-codebase@0.20.7'
  - '@craft/craft-notes@0.20.8'
  - '@craft/capability-datasec@0.2.0'
  - 'craft-eval@0.7.4'
  - 'craft@0.21.2'
  - 'craft-common-ontology@0.20.7'
