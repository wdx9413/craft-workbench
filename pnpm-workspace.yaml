packages:
  - desktop

# Match the runtime package: optional provider peers are not installed implicitly.
autoInstallPeers: false
allowBuilds:
  tesseract.js: false

# Internal versions are fixed by pnpm-lock.yaml and published to the
# authenticated local registry. Exempt only those exact versions from the
# default release-age delay; public dependencies retain the delay.
minimumReleaseAgeExclude:
  - '@craft/capability-codebase@0.16.0'
  - '@craft/capability-codebase@0.17.0'
  - '@craft/capability-codebase@0.18.0'
  - '@craft/capability-experience@0.16.0'
  - '@craft/capability-experience@0.17.0'
  - '@craft/capability-experience@0.18.0'
  - '@craft/capability-knowledge@0.16.0'
  - '@craft/capability-knowledge@0.17.0'
  - '@craft/capability-knowledge@0.18.0'
  - '@craft/capability-memory@0.16.0'
  - '@craft/capability-memory@0.17.0'
  - '@craft/capability-memory@0.18.0'
  - craft-common-base@0.16.0
  - craft-common-base@0.17.0
  - craft-common-base@0.18.0
  - craft-common-log@0.16.0
  - craft-common-log@0.17.0
  - craft-common-log@0.18.0
  - craft-common-store-local@0.16.0
  - craft-common-store-local@0.17.0
  - craft-common-store-local@0.18.0
  - craft-eval@0.3.0
  - craft-eval@0.4.0
  - craft-eval@0.5.0
  - craft@0.16.0
  - craft@0.17.0
  - craft@0.18.0
